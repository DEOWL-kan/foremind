[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foremind"
dynamic = ["version"]
description = "Run an AI development team from one seat"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foremind = "foremind.cli:main"

[tool.setuptools.dynamic]
version = {attr = "foremind.__version__"}

[tool.setuptools.packages.find]
include = ["foremind*"]

[tool.setuptools.package-data]
foremind = ["templates/*.md", "templates/roles/*.md"]
