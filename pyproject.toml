[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foremind"
version = "0.0.1"
description = "Run an AI development team from one seat"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foremind = "foremind.cli:main"

[tool.setuptools.packages.find]
include = ["foremind*"]
